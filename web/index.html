<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Rise of Rome rooms</title>
<link rel="stylesheet" href="lobby.css">
</head>
<body>
<main id="lobby">
  <header class="top">
    <h1>Age of Empires: The Rise of Rome</h1>
  </header>

  <section class="name" aria-labelledby="name-caption">
    <div class="plaque">
      <p id="name-text" class="inscription" aria-describedby="name-caption"></p>
      <form id="name-form" class="name-form" hidden novalidate>
        <label class="visually-hidden" for="name-input">Your name</label>
        <input id="name-input" class="inscription" name="name" maxlength="15" autocomplete="nickname" spellcheck="false" required>
      </form>
    </div>
    <p class="caption"><span id="name-caption">Other players see you by this name.</span>
      <button id="name-edit" class="link" type="button">Change name</button>
      <span id="name-actions" hidden><button id="name-save" class="link" type="submit" form="name-form">Save name</button>
        <button id="name-cancel" class="link" type="button">Cancel</button></span></p>
    <p id="name-error" class="error" role="alert"></p>
  </section>

  <nav class="views" role="tablist" aria-label="Rooms">
    <button id="tab-join" role="tab" aria-selected="true" aria-controls="join">Join a room</button>
    <button id="tab-create" role="tab" aria-selected="false" aria-controls="create" tabindex="-1">Create a room</button>
  </nav>

  <p id="notice" class="notice" role="status" hidden></p>

  <section id="join" role="tabpanel" aria-labelledby="tab-join">
    <label class="visually-hidden" for="search">Search rooms</label>
    <input id="search" type="search" placeholder="Search rooms or hosts" autocomplete="off" spellcheck="false">
    <ul id="rooms" class="rooms" aria-live="polite" aria-busy="true"></ul>
    <p id="rooms-empty" class="empty" hidden></p>
  </section>

  <section id="create" role="tabpanel" aria-labelledby="tab-create" hidden>
    <form id="create-form" class="create" novalidate>
      <label for="room-name">Room name</label>
      <input id="room-name" name="room" maxlength="40" autocomplete="off" spellcheck="false" required>
      <label for="room-password">Password <span class="optional">(optional)</span></label>
      <div class="password">
        <input id="room-password" name="password" type="password" maxlength="32" autocomplete="new-password" aria-describedby="password-help">
        <button id="password-show" class="link" type="button" aria-controls="room-password" aria-pressed="false">Show</button>
      </div>
      <p id="password-help" class="help">Leave it empty and anyone can join. With a password, only players who know it can.</p>
      <p id="create-error" class="error" role="alert"></p>
      <button class="primary" type="submit">Create room</button>
    </form>
  </section>
</main>

<section id="game" hidden aria-label="Game">
  <header class="game-bar">
    <p class="game-room"><span id="game-room"></span> <span id="game-lock" class="lock-note" hidden>locked</span></p>
    <div class="game-actions">
      <button id="invite" type="button" hidden>Copy invite link</button>
      <button id="fullscreen" type="button" title="Alt+Enter. The game keeps the mouse; hold Esc to leave.">Full screen</button>
      <button id="leave" type="button">Leave room</button>
      <span id="leave-confirm" hidden>Leave the match? <button id="leave-yes" type="button">Leave</button> <button id="leave-no" type="button">Stay</button></span>
    </div>
  </header>
  <div class="stage-space">
    <div id="stage"><div id="cover"><p id="cover-title"></p><p id="cover-status" role="status"></p></div></div>
  </div>
</section>

<dialog id="help" aria-label="Help"><div class="help-bar"><strong id="help-title">Help</strong><button id="help-close" type="button">Close</button></div><iframe id="help-frame" title="Help"></iframe></dialog>
<dialog id="box"><h2 id="box-title"></h2><p id="box-text"></p><form method="dialog"><button>OK</button></form></dialog>

<template id="room-row">
  <li class="room">
    <div class="room-main">
      <h2 class="room-name"><svg class="lock" viewBox="0 0 12 14" aria-hidden="true"><path d="M3 6V4a3 3 0 0 1 6 0v2"/><rect x="1" y="6" width="10" height="7.5" rx="1"/></svg><span></span></h2>
      <p class="room-host"></p>
    </div>
    <p class="room-players"></p>
    <div class="room-action"><button class="primary join" type="button">Join</button><span class="room-state"></span></div>
    <form class="room-password" hidden novalidate>
      <label>Password for this room <input type="password" maxlength="32" autocomplete="off" required></label>
      <button class="primary" type="submit">Join</button>
      <button class="link cancel" type="button">Cancel</button>
      <p class="error" role="alert"></p>
    </form>
  </li>
</template>

<!-- spessasynth_core's own imports; the stand-ins in shims/ cover the formats this build doesn't use. -->
<script type="importmap">{"imports": {"spessasynth_core": "./vendor/spessasynth_core/index.js", "fflate": "./shims/fflate.mjs", "stb-vorbis": "./shims/stb-vorbis.mjs"}}</script>
<script type="module" src="lobby.mjs"></script>
</body>
</html>
